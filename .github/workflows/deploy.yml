name: CI and Deploy to ECS

on:
  push:
    branches:
      - newfrontend

jobs:
  ci-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build


  ci-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
      - name: Build backend Docker image
        run: docker build -t multimodal_agentic_rag-backend:ci ./backend


  deploy:
    name: Deploy over SSH
    needs: [ci-frontend, ci-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/multimodal_agentic_rag
            git fetch origin
            git reset --hard origin/newfrontend
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -sf -o /dev/null http://127.0.0.1:8080/
            echo "Smoke check OK"
